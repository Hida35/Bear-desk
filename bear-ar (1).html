<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bear AR</title>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bear:#C4781A;--bear-light:#F0B55A;--bg:#0D0D0D;--surface:#1A1A1A;--text:#F5F0E8;--muted:#888}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem;gap:1.25rem}
h1{font-size:clamp(1.8rem,6vw,2.8rem);font-weight:700;letter-spacing:-0.03em;text-align:center}
h1 span{color:var(--bear-light)}
.sub{color:var(--muted);font-size:0.9rem;text-align:center;margin-top:-0.5rem}
model-viewer{width:100%;max-width:480px;height:400px;background:var(--surface);border-radius:16px;border:1px solid #2a2a2a;--progress-bar-color:#C4781A;--poster-color:#1A1A1A}
.ar-btn{display:inline-flex;align-items:center;gap:10px;background:var(--bear);color:#fff;font-family:inherit;font-weight:600;font-size:1rem;padding:14px 28px;border:none;border-radius:100px;cursor:pointer;transition:background 0.2s,transform 0.15s}
.ar-btn:hover{background:var(--bear-light);color:#111;transform:scale(1.03)}
.ar-btn:active{transform:scale(0.97)}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{background:var(--surface);border:1px solid #2a2a2a;border-radius:100px;padding:6px 14px;font-size:0.8rem;color:var(--muted)}
.chip span{color:var(--text);font-weight:600}
.footer{font-size:0.75rem;color:#555;text-align:center;margin-top:0.5rem}
</style>
</head>
